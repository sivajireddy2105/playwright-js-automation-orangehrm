name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: playwright-tests
        continue-on-error: true
        run: npm test

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Accessibility Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: reports/accessibility/
          retention-days: 30

      - name: Accessibility Gate
        id: accessibility-gate
        if: ${{ !cancelled() && steps.playwright-tests.outcome == 'success' }}
        run: npm run validate:accessibility

      - name: Finalize CI Result
        if: ${{ always() }}
        run: |
          if [ "${{ steps.playwright-tests.outcome }}" != "success" ]; then
            echo "Playwright tests failed."
            exit 1
          fi

          if [ "${{ steps.accessibility-gate.outcome }}" != "success" ]; then
            echo "Accessibility gate failed."
            exit 1
          fi

          echo "Playwright tests and accessibility gate passed."